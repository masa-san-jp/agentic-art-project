<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="80mm" viewBox="0 0 160 80">
  <title>P0007 packet template</title>
  <desc>Original cutting guide: one front piece and one back piece for a 52 by 26 millimetre paper packet.</desc>
  <rect width="160" height="80" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="0.5">
    <rect x="5" y="20" width="52" height="26"/>
    <rect x="72" y="12" width="52" height="34"/>
    <line x1="72" y1="38" x2="124" y2="38" stroke-dasharray="2,2"/>
  </g>
  <g font-family="sans-serif" font-size="4" fill="#111">
    <text x="5" y="16">front 52 x 26 mm</text>
    <text x="72" y="8">back 52 x 34 mm</text>
    <text x="72" y="53">fold 8 mm</text>
  </g>
</svg>
