<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>Visual reference board — 距離が選ぶ境界</title>
<desc>Original citation-only visual reference board. No external image body is copied.</desc>
<rect width="1200" height="760" fill="#f8fafc" />
<text x="48" y="64" font-size="30" fill="#111827" font-family="sans-serif">Visual reference board · 距離が選ぶ境界</text>
<text x="48" y="98" font-size="15" fill="#111827" font-family="sans-serif">ORIGINAL DIAGRAM · CITATION ONLY · NO EXTERNAL IMAGE BODY</text>
<rect x="48" y="150" width="650" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
<rect x="48" y="240" width="650" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
<rect x="48" y="330" width="650" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
<rect x="48" y="420" width="650" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
<text x="78" y="184" font-size="18" fill="#111827" font-family="sans-serif">FORM · 歪んだ輪郭／平坦な面／反復する線</text>
<text x="78" y="210" font-size="14" fill="#475569" font-family="sans-serif">既存図像を転載せず、内的経験を新規線画へ翻訳する</text>
<text x="78" y="274" font-size="18" fill="#111827" font-family="sans-serif">COLOR · 透明／乳白／炭黒／くすんだ黄土</text>
<text x="78" y="300" font-size="14" fill="#475569" font-family="sans-serif">低彩度の非自然色と低照度の暖色光</text>
<text x="78" y="364" font-size="18" fill="#111827" font-family="sans-serif">SPACE · 450mm停止線／1200mm導線</text>
<text x="78" y="390" font-size="14" fill="#475569" font-family="sans-serif">視線には開き、手には閉じる知覚規則</text>
<text x="78" y="454" font-size="18" fill="#111827" font-family="sans-serif">REST · 30秒周期／10秒以上の静止</text>
<text x="78" y="480" font-size="14" fill="#475569" font-family="sans-serif">健康効果や個人データを表示しない</text>
<rect x="780" y="150" width="300" height="340" rx="12" fill="#e2e8f0" stroke="#94a3b8" />
<rect x="820" y="190" width="70" height="210" fill="#475569" opacity="0.35" />
<rect x="900" y="190" width="70" height="210" fill="#475569" opacity="0.55" />
<rect x="980" y="190" width="70" height="210" fill="#475569" opacity="0.75" />
<line x1="780" y1="430" x2="1080" y2="430" stroke="#f59e0b" stroke-width="5" stroke-dasharray="12 10" />
<text x="790" y="530" font-size="16" fill="#111827" font-family="sans-serif">透明面の向こうの線画</text>
<text x="790" y="558" font-size="14" fill="#475569" font-family="sans-serif">停止線から見る／触れない</text>
<text x="48" y="680" font-size="13" fill="#475569" font-family="sans-serif">Original public diagram; external references are linked in plan.md only.</text>
