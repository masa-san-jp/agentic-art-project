<text x="78" y="300" font-size="14" fill="#475569" font-family="sans-serif">DC003-option-1 selected under IN003: この主張は、white wood の in situ な壁面に multicoloured な wall drawings を載せ、&quot;written instructions&quot; と &quot;grid&quot; や &quot;cubes&quot; の条件だけで第三者が実行できる小規模な試作を作れば検証できる可能性を示すが、どちらの主張も根拠が弱いため、耐えるかどうかは断定できない。</text>
