<text x="78" y="222" font-size="14" fill="#475569" font-family="sans-serif">DC001-option-1 selected under IN001: The idea becomes a machine&quot;は概念の成立過程に重点を置くため、市場の費用先行や確定待ちといった具体性には直接応えていない可能性が高いが、値上がりと形の目減りへの皮肉との関係は抜き書きだけでは断定できない。</text>
