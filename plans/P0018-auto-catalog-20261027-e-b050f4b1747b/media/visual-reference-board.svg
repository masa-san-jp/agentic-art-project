<text x="48" y="64" font-size="30" fill="#111827" font-family="sans-serif">Visual reference board · 小さな試し塗りで見え方が安定した部分から順に費用を確定し、曖昧さが残る箇所だけ予備枠で受け止めることで、不確かさを抱えたまま制作の費用を段階的に固められる。</text>
<text x="48" y="98" font-size="15" fill="#475569" font-family="sans-serif">VP001 · REFERENCE BOARD · CITATION ONLY</text>
<text x="48" y="142" font-size="18" fill="#475569" font-family="sans-serif">No external image body is copied into this fixture.</text>
<text x="78" y="196" font-size="18" fill="#111827" font-family="sans-serif">DC001 · UNKNOWN</text>
<text x="78" y="222" font-size="14" fill="#475569" font-family="sans-serif">DC001-option-1 selected under IN001: スーラの分割技法や展覧会の前売券期間は、いずれも根拠が弱く、費用確定の直接的な手がかりになるとは断定できず、せいぜい補助的な参考情報にとどまる可能性がある。</text>
<text x="78" y="245" font-size="12" fill="#475569" font-family="sans-serif">urn:source-ref:DC001</text>
<text x="78" y="274" font-size="18" fill="#111827" font-family="sans-serif">DC003 · UNKNOWN</text>
<text x="78" y="300" font-size="14" fill="#475569" font-family="sans-serif">DC003-option-1 selected under IN003: これらの主張は弱い根拠に基づくため断定はできないが、分割した点を観る人の目の中で混ぜる手法は光の効果を高める一方で感覚的な曖昧さも残すので、費用確定の判断をどこまで前倒しできるかは、この主張だけでは決められない。</text>
