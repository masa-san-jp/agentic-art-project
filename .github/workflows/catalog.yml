name: Validate public catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify generated catalog blocks
        run: python3 tools/catalog_sync.py --check
      - name: Run catalog tests
        run: python3 -m unittest discover -s tests -v
